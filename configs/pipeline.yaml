# Cấu hình trung tâm của pipeline. Giá trị có thể bị ghi đè bằng biến môi trường (xem src/logad/config.py).

storage:
  mode: hdfs                                # hdfs (cụm Docker) | local (đọc/ghi data/, không cần HDFS). LOGAD_STORAGE ghi đè
  local_root: data/interim/logad            # nơi ghi kết quả khi mode = local
  models_dir: models                        # model KMeans đã huấn luyện (mode = hdfs)

dataset:
  name: loghub-hdfs-v1
  local_raw: data/raw/HDFS_v1/HDFS.log                      # bản đầy đủ
  local_raw_fallback: data/raw/HDFS_2k.log                  # dùng khi chưa có bản đầy đủ (2.000 dòng, không nhãn)
  local_labels: data/raw/HDFS_v1/preprocessed/anomaly_label.csv
  sample_lines: null                        # số dòng đọc khi chạy thử nhanh (null = toàn bộ ~11M dòng)

hdfs:
  namenode: hdfs://namenode:9000
  raw_path: /logad/raw/HDFS.log
  labels_path: /logad/raw/anomaly_label.csv
  parsed_path: /logad/parsed                # parquet: 1 dòng log đã parse
  features_path: /logad/features            # parquet: 1 dòng / block (vector đặc trưng)
  window_stats_path: /logad/window_stats    # parquet: số dòng theo (cửa sổ thời gian, component, level)
  results_path: /logad/results              # parquet: điểm bất thường + dự đoán, metrics.json

spark:
  app_name: logad
  master: spark://spark-master:7077
  shuffle_partitions: 8

parsing:
  # Regex dòng log HDFS: "081109 203615 148 INFO dfs.DataNode$PacketResponder: <nội dung>"
  line_regex: '^(\d{6})\s+(\d{6})\s+(\d+)\s+(INFO|WARN|ERROR|FATAL|DEBUG)\s+([\w.$]+):\s*(.*)$'
  # Quy tắc che template nằm ở src/logad/parsing.py (MASK_RULES), dùng chung cho Python và Spark.

features:
  session_key: block_id
  time_window_seconds: 60                   # dùng cho thống kê lỗi theo cửa sổ thời gian (dashboard)
  normalize: tfidf                          # none | l2 | tfidf

models:
  kmeans:
    k_candidates: [2, 3, 4, 5, 6, 8, 12, 16]
    k_default: 4                            # dùng khi chưa có nhãn (KHÔNG chọn theo silhouette: xem kmeans_detector.select_k)
    tune_k_on_labels: true                  # có nhãn thì chọn k bằng PR-AUC trên nửa `val`; báo cáo ở nửa `test`
    seed: 42
    max_iter: 30
    silhouette_sample: 100000               # số block tối đa dùng tính silhouette (chỉ để báo cáo)
    threshold_percentile: 97                # điểm = khoảng cách tới tâm cụm gần nhất; gắn cờ ~3% block (khớp tỉ lệ bất thường của HDFS_v1)
  isolation_forest:                         # baseline sklearn (chạy trên pandas)
    n_estimators: 200
    contamination: 0.03
    seed: 42
  zscore:
    threshold: 3.0                          # phát hiện đột biến số lỗi theo cửa sổ thời gian

evaluation:
  metrics: [precision, recall, f1, pr_auc]
  label_positive: Anomaly

elasticsearch:
  host: http://elasticsearch:9200
  index_logs: logad-logs                    # chỉ dòng WARN/ERROR/FATAL (không đẩy ~11M dòng INFO)
  index_anomalies: logad-anomalies          # mỗi block một tài liệu: điểm + cờ của 3 mô hình + nhãn thật
  index_error_stats: logad-error-stats
  index_spikes: logad-spikes
  index_models: logad-models                # chỉ số đánh giá từng mô hình
  index_all_blocks: true                    # false = chỉ đẩy block bị ít nhất một mô hình gắn cờ

# Cấu hình nginx cho frontend (nginx-unprivileged lắng nghe cổng 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # API: chuyển sang service `api` trong docker compose (cùng origin nên không cần CORS)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # file build có hash trong tên: cache lâu.
    # LƯU Ý: add_header trong location ghi đè add_header ở cấp server, nên lặp lại header bảo mật ở đây.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: mọi đường dẫn còn lại trả index.html để react-router xử lý
    # (dùng `expires -1` thay vì add_header để giữ nguyên header bảo mật ở cấp server)
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

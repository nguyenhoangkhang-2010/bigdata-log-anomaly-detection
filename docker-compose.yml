# Hạ tầng đồ án LogAD. Chia 3 nhóm bằng profile để không phải bật hết khi chỉ cần xem ứng dụng:
#
#   (mặc định)      api + web        ->  docker compose up -d --build           giao diện: http://localhost:3000
#   profile bigdata HDFS + Spark     ->  docker compose --profile bigdata up -d
#   profile search  Elasticsearch + Kibana
#   tất cả                           ->  docker compose --profile bigdata --profile search up -d --build
#
# Dừng: docker compose --profile "*" down      (thêm -v để xóa luôn dữ liệu trong volume)

services:

  # ---------- Ứng dụng (luôn chạy) ----------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: logad-api:dev
    container_name: logad-api
    restart: unless-stopped
    environment:
      LOGAD_DATA_SOURCE: ${LOGAD_DATA_SOURCE:-auto}        # auto (có kết quả thật thì dùng, không thì demo) | demo | files | elasticsearch (chưa cài đặt)
      LOGAD_SERVING_DIR: /data/serving
      LOGAD_ELASTICSEARCH_URL: http://elasticsearch:9200   # auto: nếu Elasticsearch (profile search) đang chạy và đã nạp dữ liệu thì đọc từ đó
      LOGAD_CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    depends_on:
      elasticsearch:
        condition: service_healthy
        required: false                                    # không bật profile search thì bỏ qua
    volumes:
      # kết quả pipeline (job 07) gắn vào chỉ-đọc; chưa chạy pipeline thì thư mục trống và API tự dùng dữ liệu mô phỏng
      - ./data/interim/logad/results/serving:/data/serving:ro
    ports:
      - "${API_PORT:-8000}:8000"                           # Swagger: http://localhost:8000/docs

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: logad-web:dev
    container_name: logad-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:8080"

  # ---------- HDFS ----------
  namenode:
    profiles: ["bigdata"]
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: logad-namenode
    restart: unless-stopped
    environment:
      CLUSTER_NAME: logad
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
    ports:
      - "${HDFS_UI_PORT:-9870}:9870"
      - "${HDFS_RPC_PORT:-9000}:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data:/data:ro

  datanode:
    profiles: ["bigdata"]
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: logad-datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
    volumes:
      - datanode_data:/hadoop/dfs/data

  # ---------- Spark (standalone) ----------
  spark-master:
    profiles: ["bigdata"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: logad-spark:dev
    container_name: logad-spark-master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      PYTHONPATH: /opt/project/src
    ports:
      - "${SPARK_UI_PORT:-8080}:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/project/src:ro
      - ./jobs:/opt/project/jobs:ro
      - ./configs:/opt/project/configs:ro
      - ./models:/opt/project/models
      - ./data:/opt/project/data

  spark-worker:
    profiles: ["bigdata"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: logad-spark:dev
    container_name: logad-spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-8}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-8g}
      PYTHONPATH: /opt/project/src
    volumes:
      - ./src:/opt/project/src:ro
      - ./configs:/opt/project/configs:ro
      - ./models:/opt/project/models
      - ./data:/opt/project/data

  # ---------- Elasticsearch + Kibana ----------
  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: logad-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    profiles: ["search"]
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: logad-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"

volumes:
  namenode_data:
  datanode_data:
  es_data:

# Lint cho pipeline (src/, jobs/, scripts/, tests/). Backend có ruff.toml riêng trong backend/.
line-length = 120
target-version = "py311"
extend-exclude = ["backend", "frontend", "data", "notebooks"]

[lint]
select = ["E", "F", "B", "UP", "SIM"]
ignore = ["E501", "E402", "B023"]   # E402: jobs/scripts chủ động sửa sys.path trước khi import; B023: không dùng closure trong vòng lặp ở đây

# Môi trường Anaconda cho cả backend (FastAPI) và chạy Spark local.
#
#   conda env create -f environment.yml          (chạy tại thư mục gốc dự án)
#   conda activate logad
#   pip install -r requirements.txt -r backend/requirements.txt
#
# Cố ý KHÔNG đặt phần `pip:` ở đây: khi conda tự gọi pip lúc tạo env, Python chưa được activate nên
# trên Windows pip có thể lỗi "gzip module is not available". Cài pip sau khi activate thì ổn.
name: logad
channels:
  - conda-forge
dependencies:
  - python=3.11
  - openjdk=17        # PySpark 3.5 cần Java 8/11/17; không phụ thuộc Java cài sẵn trên máy
  - pip
